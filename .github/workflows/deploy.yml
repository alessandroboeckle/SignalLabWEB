name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  # Was true — but killing an in-progress deploy mid-flight can leave a
  # deployment lock stuck (GitHub Pages) or the remote /var/www/signallab
  # directory half-synced (own server). Queue behind the running deploy
  # instead of cancelling it.
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test -- --run

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-raw
          path: dist

  # Target 1: GitHub Pages (kept for now, alongside the own-server deploy
  # below — drop this job once the own-server setup is confirmed working).
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  # Target 2: own Proxmox server, over the Cloudflare Tunnel (no open port
  # on the router). Not using burnett01/rsync-deployments here — it runs
  # rsync inside its own isolated Docker container with no ProxyCommand
  # support, so it can't reach a host that's only accessible through
  # cloudflared. Plain shell steps instead, running directly on the
  # runner, where cloudflared and our own ssh config actually apply.
  deploy-server:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-raw
          path: dist

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Configure SSH over the tunnel
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host signallab-server
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${{ secrets.CF_ACCESS_CLIENT_ID }} --service-token-secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF

      - name: Deploy via rsync
        run: rsync -avzr --delete dist/ signallab-server:/var/www/signallab/

  announce:
    needs: [deploy-pages, deploy-server]
    runs-on: ubuntu-latest
    # Never let this fail the deploy itself — the site is already live by
    # this point regardless of whether the announcement goes out. Most
    # likely failure cause: the SUPABASE_SERVICE_ROLE_KEY secret below
    # hasn't been added yet (Settings -> Secrets and variables -> Actions
    # -> New repository secret, value from Supabase dashboard -> Project
    # Settings -> API -> service_role key — NOT the publishable key
    # already in the frontend code, this one needs to stay secret).
    continue-on-error: true
    steps:
      - name: Notify anyone currently online that a new version just deployed
        run: |
          http_code=$(curl -sS -o response.json -w "%{http_code}" -X POST "https://fkxucoahutmnitfnyjtr.supabase.co/realtime/v1/api/broadcast" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"topic\":\"signallab-presence\",\"event\":\"announcement\",\"private\":false,\"payload\":{\"message\":\"🚀 Neue Version verfügbar — bitte Seite neu laden (Strg+Shift+R).\",\"sentAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}]}")
          echo "HTTP status: $http_code"
          echo "Response body:"
          cat response.json
          echo ""
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Broadcast failed with HTTP $http_code — see response body above"
            exit 1
          fi
