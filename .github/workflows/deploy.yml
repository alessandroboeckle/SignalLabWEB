name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  # Was true — but killing an in-progress deploy mid-flight can leave the
  # GitHub Pages deployment lock stuck. Queue behind the running deploy
  # instead of cancelling it.
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test -- --run
  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      # GitHub Pages build (served under /SignalLabWEB/). The Proxmox LXC
      # builds itself with "npm run build:proxmox" — the automatic sync to
      # the server was removed from this workflow (it failed on every push
      # while the Cloudflare tunnel access isn't set up yet).
      - name: Build (GitHub Pages)
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
  announce:
    needs: deploy-pages
    runs-on: ubuntu-latest
    # Never let this fail the deploy itself — the site is already live by
    # this point regardless of whether the announcement goes out. Most
    # likely failure cause: the SUPABASE_SERVICE_ROLE_KEY secret below
    # hasn't been added yet (Settings -> Secrets and variables -> Actions
    # -> New repository secret, value from Supabase dashboard -> Project
    # Settings -> API -> service_role key — NOT the publishable key
    # already in the frontend code, this one needs to stay secret).
    continue-on-error: true
    steps:
      - name: Notify anyone currently online that a new version just deployed
        run: |
          http_code=$(curl -sS -o response.json -w "%{http_code}" -X POST "https://fkxucoahutmnitfnyjtr.supabase.co/realtime/v1/api/broadcast" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"topic\":\"signallab-presence\",\"event\":\"announcement\",\"private\":false,\"payload\":{\"message\":\"🚀 Neue Version verfügbar — bitte Seite neu laden (Strg+Shift+R).\",\"sentAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}]}")
          echo "HTTP status: $http_code"
          echo "Response body:"
          cat response.json
          echo ""
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Broadcast failed with HTTP $http_code — see response body above"
            exit 1
          fi
