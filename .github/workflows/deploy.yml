name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Was true — but killing an in-progress deploy-pages step mid-flight can
  # leave the Pages-side deployment lock stuck (that's the "Cancelled" run
  # from earlier, and why the very next run then hung forever in
  # "deployment_queued": GitHub Pages only allows one deployment at a time
  # and the old one never released its slot). GitHub's own starter workflow
  # deliberately uses false for this reason — queue behind the running
  # deploy instead of cancelling it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
