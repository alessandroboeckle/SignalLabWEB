name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  # Was true — but killing an in-progress deploy mid-flight can leave a
  # deployment lock stuck (GitHub Pages) or the remote /var/www/signallab
  # directory half-synced (own server). Queue behind the running deploy
  # instead of cancelling it.
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test -- --run
  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      # Two builds, because the base path differs per target:
      #   dist/          -> GitHub Pages, served under /SignalLabWEB/
      #   dist-proxmox/  -> own server, served from the root /
      # Shipping the Pages build to the server would make every asset
      # request go to /SignalLabWEB/assets/... there -> blank page.
      - name: Build (GitHub Pages)
        run: npm run build
      - name: Build (Proxmox)
        run: npm run build:proxmox -- --outDir dist-proxmox --emptyOutDir
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-proxmox
          path: dist-proxmox
  # Target 1: GitHub Pages (kept for now, alongside the own-server deploy
  # below — drop this job once the own-server setup is confirmed working).
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
  # Target 2: own Proxmox server, over the Cloudflare Tunnel (no open port
  # on the router). Not using burnett01/rsync-deployments here — it runs
  # rsync inside its own isolated Docker container with no ProxyCommand
  # support, so it can't reach a host that's only accessible through
  # cloudflared. Plain shell steps instead, running directly on the
  # runner, where cloudflared and our own ssh config actually apply.
  deploy-server:
    needs: build
    runs-on: ubuntu-latest
    env:
      # SSH_HOST must be the PUBLIC HOSTNAME of the tunnel's SSH route
      # (e.g. ssh.example.com, proxied / orange cloud) — NOT the LXC's
      # IP, not the Tailscale name. cloudflared opens TLS to this name
      # on port 443; anything that isn't served by Cloudflare fails with
      # "tls: handshake failure".
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-proxmox
          path: dist
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version
      # Fails fast with a readable message instead of rsync's opaque
      # "connection unexpectedly closed (code 255)".
      - name: Check tunnel hostname (DNS + TLS)
        run: |
          if [ -z "$SSH_HOST" ]; then echo "::error::Secret SSH_HOST ist leer"; exit 1; fi
          if ! getent hosts "$SSH_HOST" >/dev/null; then
            echo "::error::SSH_HOST löst nicht auf — DNS-Eintrag für den Tunnel fehlt"; exit 1
          fi
          if ! curl -sS -o /dev/null --max-time 15 "https://$SSH_HOST"; then
            echo "::error::TLS zu SSH_HOST:443 schlägt fehl — Hostname nicht über Cloudflare proxied, oder mehrstufige Subdomain ohne passendes Zertifikat (Universal SSL deckt nur *.domain.tld)"
            exit 1
          fi
          echo "DNS + TLS ok"
      - name: Configure SSH over the tunnel
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host signallab-server
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${CF_ID} --service-token-secret ${CF_SECRET}
          EOF
          chmod 600 ~/.ssh/config
      - name: Test SSH login
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 signallab-server \
            'echo "SSH ok: $(hostname)"; test -w /var/www/signallab && echo "write ok" || { echo "kein Schreibrecht auf /var/www/signallab"; exit 1; }'
      - name: Deploy via rsync
        run: rsync -avz --delete dist/ signallab-server:/var/www/signallab/
  announce:
    needs: [deploy-pages, deploy-server]
    runs-on: ubuntu-latest
    # Never let this fail the deploy itself — the site is already live by
    # this point regardless of whether the announcement goes out. Most
    # likely failure cause: the SUPABASE_SERVICE_ROLE_KEY secret below
    # hasn't been added yet (Settings -> Secrets and variables -> Actions
    # -> New repository secret, value from Supabase dashboard -> Project
    # Settings -> API -> service_role key — NOT the publishable key
    # already in the frontend code, this one needs to stay secret).
    continue-on-error: true
    steps:
      - name: Notify anyone currently online that a new version just deployed
        run: |
          http_code=$(curl -sS -o response.json -w "%{http_code}" -X POST "https://fkxucoahutmnitfnyjtr.supabase.co/realtime/v1/api/broadcast" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"messages\":[{\"topic\":\"signallab-presence\",\"event\":\"announcement\",\"private\":false,\"payload\":{\"message\":\"🚀 Neue Version verfügbar — bitte Seite neu laden (Strg+Shift+R).\",\"sentAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}]}")
          echo "HTTP status: $http_code"
          echo "Response body:"
          cat response.json
          echo ""
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Broadcast failed with HTTP $http_code — see response body above"
            exit 1
          fi
